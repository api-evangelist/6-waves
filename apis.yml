description: '6waves is a global mobile game publisher founded in 2008 and headquartered in Hong Kong,
  with offices in China, Japan, and the United States. The company partners with independent game
  developers around the world to publish, localize, and operate social and mobile games, offering
  culturalization, product guidance, live operations, marketing, platform relationships, customer
  service and community management, technical support, quality assurance, and VIP management. 6waves
  is recognized as a pioneer of top-grossing mobile game publishing, particularly in the Japanese
  market, and is a portfolio company of Insight Partners.'
